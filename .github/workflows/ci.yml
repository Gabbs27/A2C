name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Build (base /A2C/ — GitHub Pages)
        run: npm run build
      - name: Build (base / — para auditar con Lighthouse)
        run: VITE_BASE_PATH=/ npm run build
      - name: Lighthouse CI
        run: |
          npm install -g @lhci/cli@0.13.x
          lhci autorun
        continue-on-error: true

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      # Sin secretos de Supabase la app sirve el inventario demo,
      # así que los e2e cubren el flujo completo igualmente.
      - name: Run E2E
        run: npm run test:e2e
        env:
          CI: 'true'
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
